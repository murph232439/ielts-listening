"}, {"t": "Is it important to plan a holiday ahead?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686772/6967e9aaa2534e94aa91e31cd419f3e5.mp3", "zh": "提前规划假期重要吗？"}], "cue": "", "a": ""}, {"part": "p3", "cat": "地点类", "title": "A friend’s home you visited but you don’t want to live there", "tags": [], "lines": [{"t": "Do you think Chinese people like visiting other people's homes?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2507000-2508000/2507669/fa6e9e9c8580440a821c9e37ec357c66.mp3", "zh": "你觉得中国人喜欢去别人家做客吗？"}, {"t": "What do Chinese people do when they visit other people' homes?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2507000-2508000/2507669/44e600818a3545ffaf59e98b010d58e9.mp3", "zh": "中国人去别人家做客时会做什么？"}, {"t": "What would you consider when choosing a place of residence?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2507000-2508000/2507669/6fcce7c937d3499c9642640aac1a6f0a.mp3", "zh": "选择住处时你会考虑什么？"}, {"t": "Are there any differences between the residence in the city center and the outskirts?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2507000-2508000/2507669/dfcb2cc744fe48c68b474c17df2c57c3.mp3", "zh": "市中心和郊区的住所有什么不同吗？"}], "cue": "", "a": ""}, {"part": "p3", "cat": "地点类", "title": "A place you would like to visit in your free time", "tags": [], "lines": [{"t": "Why do you think some people choose not to travel abroad?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686642/e319f2a4634943cb86397a819474ff62.mp3", "zh": "你觉得为什么有些人选择不出国旅行？"}, {"t": "Do you think a gap period in life is important?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686642/51a64564bc84411399920a20bc7dc596.mp3", "zh": "你觉得人生中的空档期重要吗？"}], "cue": "", "a": ""}, {"part": "p3", "cat": "地点类", "title": "A boring place", "tags": [], "lines": [{"t": "Why do most children think education is boring?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686631/0158902c9f494e0d8d8b13d349dd0434.mp3", "zh": "为什么大多数孩子觉得教育无聊？"}, {"t": "Why aren't young people willing to listen to the experiences of older people?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686631/a438007c3fe94be286af4dafc60df26a.mp3", "zh": "为什么年轻人不愿意听老年人的经验？"}, {"t": "What can people do when they feel bored?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686631/170c10f9cc774cacb4cc14ede4657377.mp3", "zh": "人们感到无聊时可以做什么？"}], "cue": "", "a": ""}, {"part": "p3", "cat": "地点类", "title": "Your favorite city that you have visited", "tags": [], "lines": [{"t": "Which is more suitable for young people, urban life or rural life, and which is more suitable for old people?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686625/5a18fc78c97942a88ae4f9c40c1ace74.mp3", "zh": "城市生活和乡村生活哪个更适合年轻人，哪个更适合老年人？"}, {"t": "How do people choose a city to travel to?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686625/a221e984f935430a96c3783b94fb3086.mp3", "zh": "人们怎样选择要去的旅行城市？"}, {"t": "Do you think a tourist city is also a good place to live? Why?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686625/d82ce2778bc543bc80e528dcf658fc62.mp3", "zh": "你觉得旅游城市也是适合居住的地方吗？为什么？"}, {"t": "Do most people prefer to travel in a modern city or a historical city?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2686000-2687000/2686625/b07857581bbb464ab56ab70bb9fed515.mp3", "zh": "大多数人更喜欢去现代城市还是历史城市旅行？"}], "cue": "", "a": ""}, {"part": "p3", "cat": "地点类", "title": "A tall building in your city you like or dislike", "tags": [], "lines": [{"t": "What are the advantages of living in a tall building?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2528000-2529000/2528433/437fe362a6f4481f99721057000dba81.mp3", "zh": "住高楼有什么好处？"}, {"t": "Do you think there will be more tall buildings in the future?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2528000-2529000/2528433/86675e0c130d486f93a344ab040cd214.mp3", "zh": "你觉得未来会有更多高楼吗？"}, {"t": "Why aren't there many tall buildings in the countryside?", "a": "https://daxue-oss.koocdn.com/upload/ti/sardine/2528000-2529000/2528433/b0a5c7216d024e9d8940950500dd1333.mp3", "zh": "为什么乡下没有很多高楼？"}], "cue": "", "a": ""}];
var PART='all',KW='',MODE='browse',CUR=null,CURNODE=null;
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function hl(s){s=esc(s);if(!KW)return s;try{return s.replace(new RegExp('('+KW.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}catch(e){return s}}
function stop(){if(CUR){try{CUR.pause()}catch(e){}CUR=null}if(CURNODE){CURNODE.className=CURNODE.dataset.cls||'play';CURNODE.textContent=CURNODE.dataset.txt||'▶';CURNODE=null}}
function play(btn,url){
  if(!url)return;
  if(CURNODE===btn){stop();return}
  stop();
  CUR=new Audio(url);CURNODE=btn||null;
  if(btn){btn.dataset.cls=btn.className;btn.dataset.txt=btn.textContent;btn.className='play on';btn.textContent='❚❚'}
  CUR.onended=CUR.onerror=function(){if(btn){btn.className=btn.dataset.cls||'play';btn.textContent=btn.dataset.txt||'▶'}CUR=null;CURNODE=null};
  CUR.play().catch(function(){if(btn){btn.className=btn.dataset.cls||'play';btn.textContent=btn.dataset.txt||'▶'}CUR=null;CURNODE=null});
}
/* 查阅 */
function renderBrowse(){
  var out='',shown=0,lastcat='',kw=KW.toLowerCase();
  G.forEach(function(g){
    if(PART!=='all'&&g.part!==PART)return;
    var lines=g.lines||[];
    var titleHit=!kw||(g.title+' '+g.cat).toLowerCase().indexOf(kw)>=0;
    var hitLines=lines.filter(function(l){return !kw||titleHit||l.t.toLowerCase().indexOf(kw)>=0||(l.zh||'').indexOf(KW)>=0});
    var cueHit=!kw||titleHit||(g.cue||'').toLowerCase().indexOf(kw)>=0;
    if(kw&&!titleHit&&hitLines.length===0&&!cueHit)return;
    if(g.cat!==lastcat){lastcat=g.cat;out+='<div class="cat">'+esc(g.cat)+'</div>'}
    shown++;
    var badge=(g.tags&&g.tags.length)?'<span class="badge">'+esc(g.tags.join('/'))+'</span>':'';
    out+='<div class="card"><div class="ptitle">'+hl(g.title)+badge+'</div>';
    if(g.part==='p2'){
      if(g.cue)out+='<div class="cue">'+hl(g.cue)+'</div>';
      if(g.a)out+='<div class="qrow"><div class="qtxt" style="color:#98a0ae;font-size:13px">朗读整段 cue card</div><button class="play" data-a="'+esc(g.a)+'">▶</button></div>';
    }else{
      var show=(kw&&!titleHit)?hitLines:lines;
      show.forEach(function(l){out+='<div class="qrow"><div class="qtxt">'+hl(l.t)+(l.zh?'<div class="zhs">'+hl(l.zh)+'</div>':'')+'</div>'+(l.a?'<button class="play" data-a="'+esc(l.a)+'">▶</button>':'')+'</div>'});
    }
    out+='</div>';
  });
  document.getElementById('list').innerHTML=out||'<div class="empty">没有找到匹配的题目</div>';
  document.getElementById('cnt').textContent='共 '+shown+' 个条目';
}
/* 练习 */
var PTAB='p1',PLANG='en',PG=null,PITEM=[],PIDX=0,PSCORE=0,PCUR=null,POPTS=[],PLOCK=false;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function practiceGroups(){return G.filter(function(g){return g.part===PTAB&&(g.lines||[]).length>1})}
function label(l){return PLANG==='zh'?(l.zh||l.t):l.t}
function renderPracticeList(){
  var gs=practiceGroups(),out='',lastcat='';
  gs.forEach(function(g,i){
    if(g.cat!==lastcat){lastcat=g.cat;out+='<div class="cat">'+esc(g.cat)+'</div>'}
    var badge=(g.tags&&g.tags.length)?'<span class="badge">'+esc(g.tags.join('/'))+'</span>':'';
    out+='<div class="card gcard" data-i="'+i+'"><div><div class="ptitle">'+esc(g.title)+badge+'</div><div class="gmeta">'+g.lines.length+' 个问题 · 点开练这一组</div></div><div class="go">开始 →</div></div>';
  });
  document.getElementById('list').innerHTML=out||'<div class="empty">没有可练习的内容</div>';
  document.getElementById('pcnt').textContent=gs.length+' 个话题 · '+(PLANG==='zh'?'选中文意思':'选英文题目');
  PG=null;
}
function startGroup(gi){
  PG=practiceGroups()[gi];
  PITEM=shuffle(PG.lines.filter(function(l){return l.a}));
  if(PITEM.length<2)PITEM=shuffle(PG.lines);
  PIDX=0;PSCORE=0;renderQ();
}
function renderQ(){
  stop();
  if(PIDX>=PITEM.length){renderDone();return}
  PCUR=PITEM[PIDX];PLOCK=false;
  POPTS=shuffle(PG.lines);
  var o='<div class="phead"><div class="pmeta">'+esc(PG.cat)+' · '+esc(PG.title)+'</div><div class="pscore">第 <span>'+(PIDX+1)+'</span> / '+PITEM.length+' 题　得分 <span>'+PSCORE+'</span></div></div>';
  o+='<div class="card"><button class="bigplay" id="replay">🔊 再听一遍</button><div class="phint">听完后，选出'+(PLANG==='zh'?'这句话的中文意思':'对应的题目')+'</div><div class="opts" id="opts">';
  POPTS.forEach(function(l,i){o+='<button class="opt" data-i="'+i+'">'+esc(label(l))+'</button>'});
  o+='</div><div class="fb" id="fb"></div><button class="nextbtn" id="next" style="display:none">下一题 →</button></div>';
  document.getElementById('list').innerHTML=o;
  if(PCUR.a)play(document.getElementById('replay'),PCUR.a);
}
function choose(btn){
  if(PLOCK)return;PLOCK=true;stop();
  var pick=btn.textContent, ans=label(PCUR);
  var ok=(pick===ans);
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;if(b.textContent===ans)b.className='opt right'});
  if(!ok)btn.className='opt wrong';
  var fb=document.getElementById('fb');
  if(ok){PSCORE++;fb.className='fb ok';fb.textContent='✓ 答对了'}
  else{fb.className='fb no';fb.textContent='✗ 正确答案是绿色那一句'}
  document.querySelector('.pscore').innerHTML='第 <span>'+(PIDX+1)+'</span> / '+PITEM.length+' 题　得分 <span>'+PSCORE+'</span>';
  var nx=document.getElementById('next');nx.style.display='block';
  nx.textContent=(PIDX+1>=PITEM.length)?'看结果 →':'下一题 →';
}
function nextQ(){PIDX++;renderQ()}
function renderDone(){
  stop();
  var pct=Math.round(PSCORE/PITEM.length*100);
  var word=pct>=90?'非常棒':pct>=70?'不错':pct>=50?'继续加油':'再听几遍会更好';
  var o='<div class="done"><div class="pmeta">'+esc(PG.title)+' · '+(PLANG==='zh'?'中文意思':'英文题目')+'</div><div class="big">'+PSCORE+' / '+PITEM.length+'</div><div class="sub">'+word+'</div>';
  o+='<button class="p1b" id="again">再练这一组</button><button class="p2b" id="back">换一个话题</button></div>';
  document.getElementById('list').innerHTML=o;
}
/* 事件 */
document.getElementById('mode').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('mode').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.m===MODE?'on':'')});
  document.getElementById('browseBar').style.display=(MODE==='browse'?'':'none');
  document.getElementById('practiceBar').style.display=(MODE==='practice'?'':'none');
  stop();
  if(MODE==='browse')renderBrowse();else renderPracticeList();
};
document.getElementById('q').oninput=function(){KW=this.value.trim();renderBrowse()};
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;PART=e.target.dataset.p;
  document.getElementById('tabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.p===PART?'on':'')});renderBrowse();
};
document.getElementById('ptabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;PTAB=e.target.dataset.p;
  document.getElementById('ptabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.p===PTAB?'on':'')});renderPracticeList();
};
document.getElementById('ltabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;PLANG=e.target.dataset.l;
  document.getElementById('ltabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.l===PLANG?'on':'')});renderPracticeList();
};
document.getElementById('list').onclick=function(e){
  var t=e.target;
  var pb=t.closest?t.closest('.play'):null; if(pb){play(pb,pb.dataset.a);return}
  if(MODE==='practice'){
    if(!PG){var gc=t.closest?t.closest('.gcard'):null;if(gc){startGroup(+gc.dataset.i);return}}
    if(t.classList&&t.classList.contains('opt')){choose(t);return}
    if(t.id==='replay'){play(t,PCUR.a);return}
    if(t.id==='next'){nextQ();return}
    if(t.id==='again'){PIDX=0;PSCORE=0;renderQ();return}
    if(t.id==='back'){renderPracticeList();return}
  }
};
renderBrowse();
</script></body></html>
